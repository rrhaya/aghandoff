name: Package binaries

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'scripts/**', 'tests/**', '.github/workflows/package.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'scripts/**', 'tests/**', '.github/workflows/package.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Test native target
        run: cargo +1.85.1 test --all-targets --target '${{ matrix.target }}' --locked
      - name: Test package and installer validation
        run: python3 -B -m unittest discover -s tests -p test_distribution.py -v
      - name: Build native release binary
        run: cargo +1.85.1 build --release --target '${{ matrix.target }}' --locked
      - name: Create archive and checksum
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -B scripts/package.py --binary 'target/${{ matrix.target }}/release/aghandoff' --target '${{ matrix.target }}' --commit "$SOURCE_COMMIT" --output-dir dist
      - name: Install and run without Rust on PATH
        shell: bash
        run: |
          env PATH=/usr/bin:/bin sh scripts/install.sh \
            --archive 'dist/aghandoff-${{ matrix.target }}.tar.gz' \
            --checksum 'dist/aghandoff-${{ matrix.target }}.tar.gz.sha256' \
            --prefix "$RUNNER_TEMP/aghandoff-smoke"
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/aghandoff-smoke/bin/aghandoff" --version
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/aghandoff-smoke/bin/aghandoff" --help
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/aghandoff-smoke/bin/aghandoff" usage --help
      - name: Upload tested package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: aghandoff-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  validate-set:
    name: Validate complete release set
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only this run's native packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: aghandoff-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Verify every checksum, target, version, and source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -B scripts/prepare_release.py --directory release-assets --commit "$SOURCE_COMMIT"
      - name: Check publishing CLI flags without API calls
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh release create smoke --draft --target "$SOURCE_COMMIT" --title smoke --notes smoke --help > /dev/null
          gh release edit smoke --draft=false --latest --help > /dev/null
      - name: Upload the combined checksum manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
