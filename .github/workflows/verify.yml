name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo +1.85.1 fmt --all -- --check

      - name: Run offline integration tests
        run: cargo +1.85.1 test --all-targets --locked

      - name: Build release binary
        run: cargo +1.85.1 build --release --locked

      - name: Check release CLI
        run: |
          ./target/release/aghandoff --help
          ./target/release/aghandoff --version

      - name: Check Clippy
        run: cargo +1.85.1 clippy --all-targets --locked -- -D warnings
