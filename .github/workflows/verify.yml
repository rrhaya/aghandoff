name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt

      - name: Prepare verified build inputs
        if: runner.os == 'Linux'
        run: |
          cargo +1.85.1 fmt --all
          cargo +1.85.1 generate-lockfile
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          files = {}
          for name in ["Cargo.lock", "src/main.rs", "tests/cli.rs"]:
              data = Path(name).read_bytes()
              files[name] = {
                  "content_base64": base64.b64encode(data).decode("ascii"),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          print("AGHANDOFF_VERIFIED_INPUTS_V1=" + json.dumps(files, separators=(",", ":")))
          PY

      - name: Run offline integration tests
        run: cargo +1.85.1 test --all-targets

      - name: Build release binary
        run: cargo +1.85.1 build --release --locked

      - name: Check release CLI
        run: |
          ./target/release/aghandoff --help
          ./target/release/aghandoff --version

      - name: Check Clippy
        run: cargo +1.85.1 clippy --all-targets --locked -- -D warnings
